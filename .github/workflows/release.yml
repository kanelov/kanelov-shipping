name: Release

# Създава GitHub Release със zip на плъгина (bin-build.sh, без dev файлове).
# Стартира се при таг vX.Y.Z или ръчно (Actions > Release > Run workflow); при ръчно стартиране
# тагът се взима от версията в kanelov-shipping.php и се създава от самия release.
# Сайтовете с плъгина виждат новата версия в Плъгини > Обнови (src/Updater.php).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version and tag
        id: ver
        run: |
          VER=$(grep -m1 "Version:" kanelov-shipping.php | sed 's/.*Version: *//' | tr -d ' \r')
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$VER" ]; then
            echo "Tag ${GITHUB_REF_NAME} != plugin version $VER"; exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=v$VER" >> "$GITHUB_OUTPUT"

      - name: Lint PHP
        run: |
          set -e
          for f in $(git ls-files '*.php'); do php -l "$f" > /dev/null; done

      - name: Unit tests
        run: |
          composer install --no-interaction --no-progress --quiet
          composer test

      - name: Build zip
        run: bash bin-build.sh dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.version }}
          files: dist/kanelov-shipping-*.zip
          generate_release_notes: true
